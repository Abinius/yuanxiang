name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: PHPUnit (PHP 8.2 / SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 测试会渲染含 @vite 的布局，public/build 被 gitignore，须先构建
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 该 action 无 v3 标签，固定到 semver release
      - uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, sqlite3, dom, xml, curl, bcmath, tokenizer, gd
          coverage: none

      - name: Composer deps
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Frontend build
        run: npm ci && npm run build

      - name: Env
        run: cp .env.example .env && php artisan key:generate

      - name: Test
        run: php artisan test
